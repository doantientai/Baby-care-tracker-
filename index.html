<style>
  :root{
    color-scheme: light;
    --brand:#0ea5e9; --brand-d:#0284c7; --bg:#f8fafc; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --card:#fff; --card-border:#eef2f7; --pink:#ec4899; --pink-l:#fce7f3; --pink-ink:#9d174d;
    --indigo:#6366f1; --indigo-l:#e0e7ff; --indigo-ink:#3730a3;
    --good:#059669; --good-l:#ecfdf5; --good-ink:#065f46; --warn:#d97706; --warn-l:#fffbeb; --warn-ink:#92400e;
    --bad:#dc2626; --bad-l:#fef2f2; --bad-ink:#991b1b;
    --field-bg:#fff; --ghost-bg:#f1f5f9; --ghost-ink:#334155; --chip-bg:#fff; --chip-ink:#475569;
    --label:#94a3b8; --info-bg:#e0f2fe; --info-ink:#075985; --ev-active:#f8fafc;
    --nav-bg:rgba(255,255,255,.96); --daycap:linear-gradient(#f8fafc,#f8fafcdd);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --brand:#38bdf8; --brand-d:#7dd3fc; --bg:#0b1220; --ink:#e7ecf3; --muted:#94a3b8;
    --line:#2a3650; --card:#151d2e; --card-border:#243049; --pink:#ec4899; --pink-l:#3a2230; --pink-ink:#f9a8d4;
    --indigo:#818cf8; --indigo-l:#262b48; --indigo-ink:#c7d2fe;
    --good:#34d399; --good-l:#0f2a22; --good-ink:#86efac; --warn:#fbbf24; --warn-l:#2c2410; --warn-ink:#fcd34d;
    --bad:#f87171; --bad-l:#33181b; --bad-ink:#fca5a5;
    --field-bg:#0f1626; --ghost-bg:#222c43; --ghost-ink:#dbe3f0; --chip-bg:#172033; --chip-ink:#cbd5e1;
    --label:#7c8aa3; --info-bg:#0e2a3a; --info-ink:#bae6fd; --ev-active:#1b2436;
    --nav-bg:rgba(17,24,39,.96); --daycap:linear-gradient(#0b1220,#0b1220dd);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;overflow-x:hidden}
  #app{max-width:480px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 0 96px}
  .grid>*{min-width:0}
  svg{max-width:100%}
  .between>.small{flex:0 1 auto;text-align:right}
  h1{font-size:1.6rem;margin:0}
  h2{font-size:.95rem;margin:0}
  button{font-family:inherit;cursor:pointer}
  .wrap{padding:16px}
  .row{display:flex;align-items:center;gap:8px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .muted{color:var(--muted)}
  .small{font-size:.8rem}
  .tiny{font-size:.7rem}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .pad{padding:16px}
  .pad-s{padding:12px}
  .section-title{font-size:.85rem;font-weight:600;color:var(--muted);margin:0 0 8px}
  .tabular{font-variant-numeric:tabular-nums}
  .label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--label);margin-bottom:6px}
  .field{margin-bottom:16px}
  input,textarea,select{width:100%;border:1px solid var(--line);background:var(--field-bg);border-radius:12px;
    padding:11px 12px;font-size:16px;outline:none;color:var(--ink)}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #bae6fd66}
  textarea{min-height:60px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;
    padding:11px 16px;font-weight:600;font-size:.95rem;transition:transform .05s,background .15s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:active{background:var(--brand-d)}
  .btn-ghost{background:var(--ghost-bg);color:var(--ghost-ink)}
  .btn-block{width:100%}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);
    background:var(--chip-bg);color:var(--chip-ink);padding:9px 14px;font-size:.88rem;font-weight:600;transition:transform .05s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .swatch{width:14px;height:14px;border-radius:999px;border:1px solid rgba(0,0,0,.1)}
  .quick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;border:1px solid var(--card-border);
    background:var(--card);border-radius:16px}
  .quick .emoji{font-size:1.6rem}
  .quick .t{font-size:.78rem;font-weight:600;color:var(--chip-ink)}
  .stat .v{font-size:1.6rem;font-weight:800;line-height:1.1;margin-top:2px}
  .stat.good{background:var(--good-l);border-color:#a7f3d0}
  .stat.warn{background:var(--warn-l);border-color:#fde68a}
  .banner{border-radius:12px;padding:9px 12px;font-size:.85rem}
  .banner.info{background:var(--info-bg);color:var(--info-ink)}
  .banner.pink{background:var(--pink-l);color:var(--pink-ink)}
  .banner.good{background:var(--good-l);color:var(--good-ink);font-weight:600}
  .banner.warn{background:var(--warn-l);color:var(--warn-ink);font-weight:600}
  .banner.bad{background:var(--bad-l);color:var(--bad-ink);font-weight:700}
  .ev{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left;border:none;background:none;border-radius:12px}
  .ev:active{background:var(--ev-active)}
  .ev+.ev{border-top:1px solid var(--card-border)}
  .ev .ic{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:0 0 auto}
  .ev .mid{display:flex;flex-direction:column;min-width:0;flex:1}
  .ev .ttl{font-weight:700}
  .ev .sub{display:block;max-width:100%;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .rt{text-align:right;flex:0 0 auto;padding-left:8px}
  .ev.warn{background:var(--bad-l)}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav-bg);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .nav .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:9px 0;color:var(--label);font-size:.7rem;font-weight:600}
  .nav button .ne{font-size:1.25rem}
  .nav button.on{color:var(--brand-d)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;background:var(--card);
    border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
    animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.7}to{transform:translateY(0);opacity:1}}
  .sheet .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .x{border:none;background:var(--ghost-bg);color:var(--muted);border-radius:999px;width:32px;height:32px;font-size:1rem}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .hidden{display:none!important}
  .center{text-align:center}
  .daycap{position:sticky;top:0;background:var(--daycap);padding:6px 2px;z-index:5}
  .filterbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px}
  .filterbar .chip{flex:0 0 auto}
  svg.chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .side{border-radius:10px;padding:6px 4px;text-align:center}
  .side.on{background:var(--pink);color:#fff}
  .side.off{background:var(--pink-l);color:var(--pink-ink)}

<body>
<div id="app"></div>
<nav class="nav">
  <div class="inner" id="nav"></div>
</nav>
<div id="sheet-root"></div>

<script>
"use strict";
/* ============================================================ Baby Care Tracker
   Single-file app. No build, no server. Data is stored in this browser
   (localStorage). General newborn-care guidance — not medical advice.
============================================================================== */

/* ----------------------------------------------------------------- storage -- */
const LS = {
  settings: 'bct.settings',
  events: 'bct.events',
  timers: 'bct.timers',
  outbox: 'bct.outbox',
  lastSync: 'bct.lastsync',
};
const DEFAULT_SETTINGS = {
  babyName: 'Baby', babyDob: null,
  caregivers: ['Papa', 'Maman'], currentCaregiver: 'Papa',
  lat: 48.7996, lon: 2.0667, locationLabel: "Saint-Cyr-l'École (78210)",
  tempUnit: 'C',
  syncUrl: '', syncToken: '',
  feedGapEnabled: false, feedGapDayH: 3, feedGapNightH: 5,
  lang: 'en', theme: 'system',
  vitDEnabled: true, vitDTime: '07:00',
};
function loadJSON(key, fallback){ try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }catch(e){ return fallback; } }
function saveJSON(key, v){ localStorage.setItem(key, JSON.stringify(v)); }

let settings = Object.assign({}, DEFAULT_SETTINGS, loadJSON(LS.settings, {}));
let events = loadJSON(LS.events, []);

function saveSettings(patch){ settings = Object.assign({}, settings, patch); saveJSON(LS.settings, settings); applyTheme(); render(); }

// Theme: 'system' follows the OS; 'light'/'dark' force it.
function resolvedTheme(){
  if(settings.theme==='light'||settings.theme==='dark') return settings.theme;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  const r = resolvedTheme();
  document.documentElement.setAttribute('data-theme', r);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', r==='dark' ? '#0b1220' : '#0ea5e9');
}
if(window.matchMedia){
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(settings.theme==='system') applyTheme(); }); }catch(e){}
}
function persistEvents(){ saveJSON(LS.events, events); }

// IDs are unique strings so two phones never collide when offline.
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function findEvent(id){ return events.find(e=>String(e.id)===String(id)); }
function addEvent(ev){
  const ts = Date.now();
  const e = Object.assign({ id:newId(), createdAt:ts, updatedAt:ts }, ev);
  events.push(e); persistEvents(); queueUpsert(e); return e;
}
function updateEvent(id, patch){
  const i = events.findIndex(e=>String(e.id)===String(id));
  if(i>=0){ events[i] = Object.assign({}, events[i], patch, { updatedAt:Date.now() }); persistEvents(); queueUpsert(events[i]); }
}
function deleteEvent(id){
  const e = findEvent(id);
  events = events.filter(x=>String(x.id)!==String(id)); persistEvents();
  if(e) queueDelete(id);
}

/* -------------------------------------------------- Google Sheet sync ------ */
// Persists the log to a shared Google Sheet via an Apps Script web app, so both
// parents see the same data. Fully optional: with no URL set the app is local.
let syncState = { syncing:false, last: loadJSON(LS.lastSync, null), error:null };
function syncReady(){ return !!(settings.syncUrl && /^https?:\/\//.test(settings.syncUrl)); }
function loadOutbox(){ return loadJSON(LS.outbox, []); }
function saveOutbox(b){ saveJSON(LS.outbox, b); }
function queueUpsert(e){ const b=loadOutbox(); b.push({op:'upsert', payload:e}); saveOutbox(b); pushSoon(); }
function queueDelete(id){ const b=loadOutbox(); b.push({op:'delete', id:String(id), updatedAt:Date.now()}); saveOutbox(b); pushSoon(); }

function apiUrl(params){
  const u = new URL(settings.syncUrl);
  Object.keys(params).forEach(k=>u.searchParams.set(k, params[k]));
  if(settings.syncToken) u.searchParams.set('token', settings.syncToken);
  u.searchParams.set('_', Date.now());
  return u.toString();
}
async function apiCall(params){
  const res = await fetch(apiUrl(params), { redirect:'follow' });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'sync failed');
  return j;
}
async function flushOutbox(){
  if(!syncReady()) return;
  let box = loadOutbox();
  while(box.length){
    const item = box[0];
    if(item.op==='upsert') await apiCall({ action:'upsert', event: JSON.stringify(item.payload) });
    else if(item.op==='delete') await apiCall({ action:'delete', id:item.id, updatedAt:item.updatedAt });
    box.shift(); saveOutbox(box);
  }
}
function mergeRemote(remote){
  const byId = {}; events.forEach(e=>byId[String(e.id)] = e);
  let changed = false;
  remote.forEach(r=>{
    const id = String(r.id); const local = byId[id];
    if(r.deleted){ if(local && (r.updatedAt||0) >= (local.updatedAt||0)){ delete byId[id]; changed=true; } return; }
    if(!local || (r.updatedAt||0) > (local.updatedAt||0)){ byId[id] = r; changed=true; }
  });
  if(changed){ events = Object.values(byId).filter(e=>!e.deleted); persistEvents(); }
}
async function pull(){ if(!syncReady()) return; const j = await apiCall({ action:'list' }); mergeRemote(j.events || []); }
let pushTimer = null;
function pushSoon(){
  if(!syncReady()){ updateSyncUI(); return; }
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    syncState.syncing = true; updateSyncUI();
    flushOutbox()
      .then(()=>{ syncState.last = Date.now(); saveJSON(LS.lastSync, syncState.last); syncState.error = null; })
      .catch(e=>{ syncState.error = e.message; })
      .finally(()=>{ syncState.syncing = false; updateSyncUI(); });
  }, 400);
}
async function syncNow(){
  if(!syncReady()){ updateSyncUI(); return; }
  syncState.syncing = true; syncState.error = null; updateSyncUI();
  try{
    await flushOutbox();
    await pull();
    syncState.last = Date.now(); saveJSON(LS.lastSync, syncState.last);
  }catch(e){ syncState.error = e.message || 'sync error'; }
  syncState.syncing = false; updateSyncUI(); render();
}
function syncStatusHtml(){
  if(!syncReady()) return '<span class="muted">'+t('Not connected — paste your Google Sheet web-app URL above, then Sync.')+'</span>';
  const p = loadOutbox().length;
  if(syncState.syncing) return '⟳ '+t('Syncing…');
  if(syncState.error) return '<span style="color:#dc2626">⚠ '+esc(syncState.error)+'</span>'+(p?(' · '+p+' '+t('pending')):'');
  return '<span style="color:var(--good)">✓ '+t('Synced')+'</span>'+(syncState.last?(' · '+relTime(syncState.last)):'')+(p?(' · '+p+' '+t('pending')):'');
}
function syncPillHtml(){
  if(!syncReady()) return '';
  if(syncState.syncing) return '⟳ '+t('Syncing…');
  if(syncState.error) return '<span style="color:#dc2626">⚠ '+t('sync error')+'</span>';
  return '<span style="color:var(--good)">✓ '+t('Sheet synced')+'</span>';
}
function updateSyncUI(){
  const s = document.getElementById('syncStatus'); if(s) s.innerHTML = syncStatusHtml();
  const p = document.getElementById('syncPill'); if(p) p.innerHTML = syncPillHtml();
}

/* ----------------------------------------------------------------- i18n ----- */
// English strings are used as keys; FR holds French translations. EN holds only
// templated strings (with {placeholders}). Unknown keys fall back to themselves.
const EN = {

  'Language':'Langue','Appearance':'Apparence','Auto':'Auto','Light':'Clair','Dark':'Sombre',

  'Save the log to a shared Google Sheet so you and your wife see the same data on both phones. The app still works offline and syncs when online.':"Enregistrez le journal dans un Google Sheet partagé pour voir les mêmes données sur les deux téléphones. L'app fonctionne hors ligne et se synchronise une fois en ligne.",

/* ------------------------------------------------------- clinical reference -- */
const DAY = 86400000;
function ageInDays(ref=Date.now()){ return settings.babyDob==null ? null : Math.floor((ref - settings.babyDob)/DAY); }
function ageInMonths(ref=Date.now()){ return settings.babyDob==null ? null : (ref - settings.babyDob)/(DAY*30.4375); }

const FEVER_C = { rectal:38.0, ear:38.0, forehead:38.0, oral:37.8, axillary:37.5 };
function assessTemperature(c, method){
  const th = FEVER_C[method] ?? 38.0;
  const months = ageInMonths();
  if(c < 36.0) return { level:'bad', urgent:c<35.5, msg: c<35.5 ? 'Low temperature — warm the baby and contact a doctor.' : 'Slightly low — warm the baby and recheck soon.' };
  if(c >= th && months!=null && months < 3) return { level:'bad', urgent:true, msg:'🚨 Fever in a baby under 3 months is an emergency — call your doctor or emergency services now.' };
  if(c >= th) return { level:'bad', urgent:c>=39, msg: c>=39 ? 'High fever — contact your doctor.' : 'Fever detected — monitor closely and consider contacting your doctor.' };
  if(c >= th-0.4) return { level:'warn', urgent:false, msg:'Slightly elevated — keep an eye on it.' };
  return { level:'good', urgent:false, msg:'Temperature in the normal range.' };
}

function vitDDue(){
  if(!settings.vitDEnabled) return false;

}

/* ----------------------------------------------------------------- time ----- */
function pad(n){ return String(n).padStart(2,'0'); }
function clock(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dateKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function sameDay(a,b){ return dateKey(a)===dateKey(b); }
function dayLabel(ts){
  const now=Date.now();
  if(sameDay(ts,now)) return t('Today');
  if(sameDay(ts, now-DAY)) return t('Yesterday');
  return new Date(ts).toLocaleDateString(locale(),{weekday:'short',day:'numeric',month:'short'});
}
function fmtDur(sec){
  if(sec==null || sec<0 || isNaN(sec)) return '—';
  sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60;
  if(m<1) return s+'s';
  if(m<60) return (s>0 && m<10) ? m+'m '+s+'s' : m+'m';
  const h=Math.floor(m/60); return h+'h '+(m%60)+'m';
}
function relTime(ts){
  const diff=Math.round((Date.now()-ts)/1000);
  if(diff<60) return t('just now');
  if(diff<3600) return t('relMin',{n:Math.floor(diff/60)});
  if(diff<DAY/1000) return t('relHour',{n:Math.floor(diff/3600)});
  return t('relDay',{n:Math.floor(diff/86400)});
}
function toLocalInput(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function fromLocalInput(v){ return new Date(v).getTime(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function readTimers(){ return loadJSON(LS.timers, []); }
function writeTimers(t){ saveJSON(LS.timers, t); }
function getTimer(kind){ return readTimers().find(t=>t.kind===kind); }
function startSleep(){ const t=readTimers().filter(x=>x.kind!=='sleep'); t.push({kind:'sleep',startedAt:Date.now()}); writeTimers(t); render(); }
function startBreastfeed(side){
  const now=Date.now();
  const t=readTimers().filter(x=>x.kind!=='breastfeed');
  t.push({kind:'breastfeed',startedAt:now,startSide:side,currentSide:side,leftSec:0,rightSec:0,lastSwitchAt:now});
  writeTimers(t); render();
}
function bank(t, at){
  if(!t.currentSide||t.lastSwitchAt==null) return t;
  const el = t.paused ? 0 : Math.max(0,Math.round((at-t.lastSwitchAt)/1000)); // don't accrue while paused
  return Object.assign({},t,{ leftSec:(t.leftSec||0)+(t.currentSide==='left'?el:0), rightSec:(t.rightSec||0)+(t.currentSide==='right'?el:0), lastSwitchAt:at });
}
function switchBreast(){
  const all=readTimers(); const t=all.find(x=>x.kind==='breastfeed'); if(!t) return;
  const b=bank(t,Date.now()); b.currentSide = b.currentSide==='left'?'right':'left';
  writeTimers(all.filter(x=>x.kind!=='breastfeed').concat(b)); render();
}
function pauseBreast(){
  const all=readTimers(); const t=all.find(x=>x.kind==='breastfeed'); if(!t) return;
  let b;
  if(t.paused){ b=Object.assign({},t,{paused:false,lastSwitchAt:Date.now()}); }   // resume
  else { b=bank(t,Date.now()); b.paused=true; }                                    // bank elapsed, then pause
  writeTimers(all.filter(x=>x.kind!=='breastfeed').concat(b)); render();
}
function stopTimer(kind){
  const all=readTimers(); const f=all.find(x=>x.kind===kind);
  writeTimers(all.filter(x=>x.kind!==kind));
  if(!f) return undefined;
  return kind==='breastfeed' ? bank(f,Date.now()) : f;
}
function stopSleep(){ const t=stopTimer('sleep'); if(t) openSheet('sleep',null,{at:t.startedAt,endAt:Date.now()}); }
function stopBreast(){ const t=stopTimer('breastfeed'); if(t) openSheet('breastfeed',null,{at:t.startedAt,endAt:Date.now(),data:{side:t.startSide||'left',leftSec:t.leftSec||0,rightSec:t.rightSec||0}}); }

/* ---- HOME ---- */
function todays(){ const k=dateKey(Date.now()); return events.filter(e=>dateKey(e.at)===k); }
function lastOfType(type){ const a=events.filter(e=>e.type===type).sort((x,y)=>y.at-x.at); return a[0]; }
function daySummary(list){
  let wet=0,dirty=0,feeds=0,sleepSec=0;
  for(const e of list){
    if(e.type==='diaper'){ const k=e.data.kind; if(k==='pee'||k==='both')wet++; if(k==='poop'||k==='both')dirty++; }
    else if(e.type==='breastfeed'||e.type==='bottle') feeds++;
    else if(e.type==='sleep') sleepSec += (e.data.durationSec!=null?e.data.durationSec:(e.endAt?(e.endAt-e.at)/1000:0));
  }
  return {wet,dirty,feeds,sleepSec};
}

function viewTimeline(){
  const filters=[['all','All','🗂️'],['diaper','Diaper','🧷'],['breastfeed','Feed','🤱'],['bottle','Bottle','🍼'],['sleep','Sleep','😴'],['temperature','Temp','🌡️'],['cry','Cry','😢']];
  const sorted=events.slice().sort((a,b)=>b.at-a.at).filter(e=>state.filter==='all'||e.type===state.filter);
  const groups=[]; const idx={};
  for(const e of sorted){ const k=dateKey(e.at); if(!idx[k]){ idx[k]=[]; groups.push([k,idx[k]]); } idx[k].push(e); }
  return `<div class="wrap">
    <h1 style="margin-bottom:12px">${t('Timeline')}</h1>
    <div class="filterbar">${filters.map(([v,l,e])=>`<button class="chip ${state.filter===v?'on':''}" data-filter="${v}">${e} ${t(l)}</button>`).join('')}</div>
    ${groups.length===0?'<div class="card pad center muted">'+t('No entries yet.')+'</div>':
      groups.map(([k,items])=>`<div style="margin-bottom:18px"><div class="daycap section-title">${dayLabel(items[0].at)}</div><div class="card" style="padding:4px">${items.map(eventRow).join('')}</div></div>`).join('')}

}

/* ---- TRENDS ---- */
function buildDaily(n){
  const rows=[]; const idx={};
  const start=new Date(); start.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){ const d=new Date(start.getTime()-i*DAY); const k=dateKey(d.getTime());
    const row={k,label:(d.getDate())+'/'+(d.getMonth()+1),wet:0,dirty:0,feeds:0,sleepH:0,_sleep:0}; idx[k]=row; rows.push(row); }
  for(const e of events){ const r=idx[dateKey(e.at)]; if(!r) continue;
    if(e.type==='diaper'){ const k=e.data.kind; if(k==='pee'||k==='both')r.wet++; if(k==='poop'||k==='both')r.dirty++; }
    else if(e.type==='breastfeed'||e.type==='bottle') r.feeds++;
    else if(e.type==='sleep') r._sleep += (e.data.durationSec!=null?e.data.durationSec:(e.endAt?(e.endAt-e.at)/1000:0));
  }
  rows.forEach(r=>r.sleepH=Math.round(r._sleep/360)/10);
  return rows;
}
function barChart(rows, series){
  const W=440,H=180,padL=24,padB=22,padT=8;
  const max=Math.max(1,...rows.map(r=>series.reduce((s,se)=>s+(r[se.key]||0),0)));
  const bw=(W-padL)/rows.length;
  let bars='';
  rows.forEach((r,i)=>{
    let y=H-padB; const x=padL+i*bw+bw*0.18; const w=bw*0.64;
    series.forEach(se=>{ const v=r[se.key]||0; const h=(v/max)*(H-padB-padT); y-=h;
      if(h>0) bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${se.color}" rx="2"></rect>`; });
    if(i%2===0||rows.length<=7) bars+=`<text x="${(padL+i*bw+bw/2).toFixed(1)}" y="${H-6}" font-size="9" fill="#94a3b8" text-anchor="middle">${r.label}</text>`;
  });
  const ticks=[0,Math.ceil(max/2),max].filter((v,i,a)=>a.indexOf(v)===i);
  const grid=ticks.map(t=>{ const y=H-padB-(t/max)*(H-padB-padT); return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#eef2f7"></line><text x="0" y="${(y+3).toFixed(1)}" font-size="9" fill="#cbd5e1">${t}</text>`; }).join('');
  const legend=`<div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${se.name}</span>`).join('')}</div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${bars}</svg>${legend}`;
}
function lineChart(points){
  const W=440,H=180,padL=30,padB=22,padT=10;
  if(points.length<2) return '<div class="center muted small" style="padding:24px">'+t('Log at least two weight measurements to see a curve.')+'</div>';
  const xs=points.map((p,i)=>i), ys=points.map(p=>p.v);
  const minY=Math.min(...ys), maxY=Math.max(...ys), span=(maxY-minY)||1;
  const X=i=>padL+(i/(points.length-1))*(W-padL-6);
  const Y=v=>H-padB-((v-minY)/span)*(H-padB-padT);
  let d=''; points.forEach((p,i)=>{ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' '; });
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="#0ea5e9"></circle>`).join('');
  const labels=points.map((p,i)=> (i===0||i===points.length-1)?`<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9" fill="#94a3b8" text-anchor="middle">${p.label}</text>`:'').join('');
  const yl=[minY,maxY].map(v=>`<text x="0" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#cbd5e1">${v}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${yl}<path d="${d}" fill="none" stroke="#0ea5e9" stroke-width="2"></path>${dots}${labels}</svg>`;
}
function viewTrends(){
  const rows=buildDaily(14);
  const weights=events.filter(e=>e.type==='growth'&&e.data.weightKg!=null).sort((a,b)=>a.at-b.at).map(e=>({label:(new Date(e.at).getDate())+'/'+(new Date(e.at).getMonth()+1),v:e.data.weightKg}));
  return `<div class="wrap grid" style="gap:16px">
    <h1>${t('Trends')}</h1>
    <div class="card pad"><h2>${t('Diapers per day')}</h2><div class="tiny muted" style="margin-bottom:4px">${t('Wet vs dirty — last 14 days')}</div>${barChart(rows,[{key:'wet',name:t('Wet'),color:'#0ea5e9'},{key:'dirty',name:t('Dirty'),color:'#f59e0b'}])}</div>
    <div class="card pad"><h2>${t('Feeds per day')}</h2><div class="tiny muted" style="margin-bottom:4px">${t('Breast + bottle — last 14 days')}</div>${barChart(rows,[{key:'feeds',name:t('Feeds'),color:'#ec4899'}])}</div>
    <div class="card pad"><h2>${t('Sleep per day')}</h2><div class="tiny muted" style="margin-bottom:4px">${t('Total hours — last 14 days')}</div>${barChart(rows,[{key:'sleepH',name:t('Sleep (h)'),color:'#6366f1'}])}</div>
    <div class="card pad"><h2>${t('Weight')}</h2><div class="tiny muted" style="margin-bottom:4px">${t('kg over time')}</div>${lineChart(weights)}</div>
  </div>`;
}

      <div class="field"><label class="label">${t('Temperature unit')}</label><div class="chips"><button class="chip ${settings.tempUnit==='C'?'on':''}" data-unit="C">°C</button><button class="chip ${settings.tempUnit==='F'?'on':''}" data-unit="F">°F</button></div></div>
    </div>
    <div class="card pad">
      <h2>${t('Backup & share')}</h2>
      <div class="tiny muted" style="margin:4px 0 12px">${t("Export a CSV for your pediatrician, or a JSON backup to move data to the other parent's phone (imports are de-duplicated).")}</div>
      <div class="chips">
        <button class="btn btn-ghost" data-act="export-csv">${t('⬇ Export CSV')}</button>
        <button class="btn btn-ghost" data-act="export-json">${t('⬇ Export backup')}</button>
        <button class="btn btn-ghost" data-act="import">${t('⬆ Import backup')}</button>
      </div>
      <div id="ioMsg" class="small" style="color:var(--brand-d);margin-top:10px"></div>
    </div>
    <div class="center tiny muted" style="padding:0 8px">${t('Baby Care Tracker · stored privately in this browser. Guidance is general and not a substitute for medical advice.')}</div>
  </div>`;
}

/* ----------------------------------------------------------------- sheet ---- */
function defaultData(type){
  switch(type){
    case 'diaper': return {kind:'pee'};
    case 'breastfeed': return {side:'left',leftSec:0,rightSec:0};
    case 'bottle': return {content:'formula',volumeMl:60};
    case 'temperature': return {celsius:37.0,method:'axillary'};
    case 'cry': return {intensity:'crying'};
    case 'pump': return {side:'both',volumeMl:0};
    case 'medication': return {name:''};
    default: return {};
  }
}
// "Done by" default: breastfeeding is at the breast, so default to mom when present.
function defaultCaregiver(type){
  if(type==='breastfeed'){
    const mom=settings.caregivers.find(c=>/maman|mom|mum|m[eè]re/i.test(c));
    if(mom) return mom;
  }
  return settings.currentCaregiver;
}
function openSheet(type, editing, initial){
  let draft, at, endAt, caregiver, note;
  if(editing){ draft=Object.assign({},editing.data); at=editing.at; endAt=editing.endAt; caregiver=editing.caregiver; note=editing.note||''; type=editing.type; }
  else { draft=Object.assign(defaultData(type),(initial&&initial.data)||{}); at=(initial&&initial.at)||Date.now(); endAt=initial&&initial.endAt; caregiver=defaultCaregiver(type); note=(initial&&initial.note)||''; }
  state.sheet={type,editing:editing||null,draft,at,endAt,caregiver,note};
  renderSheet();
}
function closeSheet(){ state.sheet=null; render(); }
function hasRange(t){ return t==='breastfeed'||t==='sleep'||t==='pump'||t==='cry'; }

function renderSheet(){
  const s=state.sheet;
  const prev=sheetRoot.querySelector('.sheet');
  const savedScroll=prev?prev.scrollTop:0;
  const isReRender=!!prev;
  if(!s){ sheetRoot.innerHTML=''; return; }
  const m=META[s.type];
  const info=infoText(s.type);
  sheetRoot.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog">
    <div class="head"><h2>${m.emoji} ${t(s.editing?'Edit':'Log')} ${t(m.label).toLowerCase()}</h2>
      <div class="row" style="gap:6px">
        <button class="x" data-act="info-toggle" title="${t('Info')}" style="${s.showInfo?'background:var(--brand);color:#fff':''}">ⓘ</button>
        <button class="x" data-act="close">✕</button>
      </div>
    </div>
    ${s.showInfo&&info?`<div class="banner info" style="margin-bottom:14px">${esc(info)}</div>`:''}
    <div id="sheetBody">${sheetBody(s)}</div>
    <div class="row" style="margin-top:8px">
      ${s.editing?`<button class="btn btn-ghost" style="color:#dc2626" data-act="delete">${t('Delete')}</button>`:''}
      <button class="btn btn-primary" style="flex:1" data-act="save">${t(s.editing?'Save changes':'Save')}</button>
    </div>
  </div>`;
  const sheetEl=sheetRoot.querySelector('.sheet');
  if(sheetEl){ if(isReRender){ sheetEl.style.animation='none'; sheetEl.scrollTop=savedScroll; } }
}
function chipgroup(name, opts, val){
  return `<div class="chips" data-chip="${name}">${opts.map(o=>`<button class="chip ${val===o.v?'on':''}" data-v="${o.v}">${o.e?o.e+' ':''}${t(o.l)}</button>`).join('')}</div>`;
}
function sheetBody(s){
  const d=s.draft; let html='';
  if(s.type==='diaper'){
    html+=`<div class="field"><label class="label">${t("What's in the diaper?")}</label>${chipgroup('kind',[{v:'pee',l:'Pee',e:'💧'},{v:'poop',l:'Poop',e:'💩'},{v:'both',l:'Both',e:'💧💩'}],d.kind)}</div>`;
    html+=`<div class="field"><label class="label">${t('Amount')}</label>${chipgroup('amount',[{v:'little',l:'Little'},{v:'average',l:'Average'},{v:'full',l:'Full'}],d.amount)}</div>`;
    if(d.kind==='poop'||d.kind==='both'){
      html+=`<div class="field"><label class="label">${t('Stool color')}</label><div class="chips" data-chip="color">${Object.keys(STOOL).map(c=>`<button class="chip ${d.color===c?'on':''}" data-v="${c}"><span class="swatch" style="background:${STOOL[c].sw}"></span>${t(STOOL[c].label)}</button>`).join('')}</div></div>`;
      if(d.color){ const con=stoolConcerning(d.color); html+=`<div class="banner ${con?'bad':''}" style="${con?'':'background:var(--ghost-bg);color:var(--muted)'};margin-bottom:16px">${con?'⚠ ':''}${t(STOOL[d.color].note)}</div>`; }
      html+=`<div class="field"><label class="label">${t('Texture')}</label>${chipgroup('texture',[{v:'liquid',l:'Liquid'},{v:'seedy',l:'Seedy'},{v:'soft',l:'Soft'},{v:'formed',l:'Formed'},{v:'hard',l:'Hard'},{v:'mucousy',l:'Mucousy'}],d.texture)}</div>`;
    }
  } else if(s.type==='breastfeed'){
    const total=(d.leftSec||0)+(d.rightSec||0);
    html+=`<div class="field"><label class="label">${t('Started on')}</label>${chipgroup('side',[{v:'left',l:'Left'},{v:'right',l:'Right'}],d.side)}</div>`;
    html+=`<div class="grid g2"><div class="field"><label class="label">${t('Left (min)')}</label><input type="number" inputmode="numeric" data-num="leftSec" data-mul="60" value="${d.leftSec?Math.round(d.leftSec/60):''}" placeholder="0"></div>
      <div class="field"><label class="label">${t('Right (min)')}</label><input type="number" inputmode="numeric" data-num="rightSec" data-mul="60" value="${d.rightSec?Math.round(d.rightSec/60):''}" placeholder="0"></div></div>`;
    html+=`<div class="small muted" id="bfTotal" style="margin:-8px 0 14px">${total>0?(t('Total')+' '+fmtDur(total)+' · L '+fmtDur(d.leftSec)+' / R '+fmtDur(d.rightSec)):''}</div>`;
    html+=`<div class="field"><label class="label">${t('Position')}</label>${chipgroup('position',POSITIONS.map(p=>({v:p.v,l:p.l})),d.position)}</div>`;
  } else if(s.type==='bottle'){
    html+=`<div class="field"><label class="label">${t('Content')}</label>${chipgroup('content',[{v:'formula',l:'Formula'},{v:'expressed',l:'Expressed milk'},{v:'mixed',l:'Mixed'}],d.content)}</div>`;
    html+=`<div class="field"><label class="label">${t('Volume (ml)')}</label><input type="number" inputmode="numeric" data-num="volumeMl" value="${d.volumeMl}"><div class="pillrow">${[30,60,90,120,150,180].map(v=>`<button class="chip" data-preset="volumeMl" data-pv="${v}">${v}</button>`).join('')}</div></div>`;
  } else if(s.type==='temperature'){
    const a=assessTemperature(d.celsius,d.method);
    html+=`<div class="field"><label class="label">${t('Temperature (°C)')}</label><input type="number" step="0.1" inputmode="decimal" data-num="celsius" data-live="temp" value="${d.celsius}" style="font-size:1.4rem;font-weight:800"></div>`;
    html+=`<div class="field"><label class="label">${t('Method')}</label>${chipgroup('method',[{v:'axillary',l:'Armpit'},{v:'rectal',l:'Rectal'},{v:'ear',l:'Ear'},{v:'forehead',l:'Forehead'},{v:'oral',l:'Oral'}],d.method)}</div>`;
    html+=`<div class="banner ${a.level}" id="tempMsg" style="margin-bottom:16px">${t(a.msg)}</div>`;
  } else if(s.type==='cry'){
    html+=`<div class="field"><label class="label">${t('Intensity')}</label>${chipgroup('intensity',[{v:'fussy',l:'Fussy'},{v:'crying',l:'Crying'},{v:'inconsolable',l:'Inconsolable'}],d.intensity)}</div>`;
  } else if(s.type==='pump'){
    html+=`<div class="field"><label class="label">${t('Side')}</label>${chipgroup('side',[{v:'left',l:'Left'},{v:'right',l:'Right'},{v:'both',l:'Both'}],d.side)}</div>`;
    html+=`<div class="field"><label class="label">${t('Volume (ml)')}</label><input type="number" inputmode="numeric" data-num="volumeMl" value="${d.volumeMl}"></div>`;
  } else if(s.type==='medication'){
    html+=`<div class="field"><label class="label">${t('Medication / supplement')}</label><input data-str="name" value="${esc(d.name||'')}" placeholder="${t('e.g. Vitamin D')}"><div class="pillrow">${['Vitamin D','Paracetamol','Probiotics'].map(n=>`<button class="chip" data-preset-str="name" data-pv="${esc(n)}">${t(n)}</button>`).join('')}</div></div>`;
    html+=`<div class="field"><label class="label">${t('Dose (optional)')}</label><input data-str="dose" value="${esc(d.dose||'')}" placeholder="${t('e.g. 400 IU')}"></div>`;
  } else if(s.type==='growth'){
    html+=`<div class="field"><label class="label">${t('Weight (kg)')}</label><input type="number" step="0.01" inputmode="decimal" data-num="weightKg" value="${d.weightKg??''}"></div>`;
    html+=`<div class="field"><label class="label">${t('Height (cm)')}</label><input type="number" step="0.1" inputmode="decimal" data-num="heightCm" value="${d.heightCm??''}"></div>`;
    html+=`<div class="field"><label class="label">${t('Head circumference (cm)')}</label><input type="number" step="0.1" inputmode="decimal" data-num="headCircumferenceCm" value="${d.headCircumferenceCm??''}"></div>`;
  }
  // common time + caregiver + note
  const tadj=[['Now',0],['-5m',5],['-15m',15],['-30m',30],['-1h',60],['-2h',120]];
  html+=`<div class="field"><label class="label">${hasRange(s.type)?t('Start'):t('Time')}</label><input type="datetime-local" data-when="at" value="${toLocalInput(s.at)}">
    <div class="pillrow">${tadj.map(([l,m])=>`<button class="chip" data-tadj="${m}">${l==='Now'?t('Now'):l}</button>`).join('')}</div></div>`;
  if(hasRange(s.type)){
    html+=`<div class="field"><label class="label">${t('End (optional)')}</label><input type="datetime-local" data-when="endAt" value="${s.endAt?toLocalInput(s.endAt):''}"></div>`;
  }
  html+=`<div class="field"><label class="label">${t('Done by')}</label>${chipgroup('caregiver',settings.caregivers.map(c=>({v:c,l:c})),s.caregiver)}</div>`;
  html+=`<div class="field"><label class="label">${t('Note')}</label><textarea data-note placeholder="${t('Anything to remember…')}">${esc(s.note)}</textarea></div>`;
  return html;
}
function saveSheet(){
  const s=state.sheet; if(!s) return;
  const d=Object.assign({},s.draft);
  let durationSec = (s.endAt && s.endAt>s.at) ? Math.round((s.endAt-s.at)/1000) : undefined;
  if(s.type==='breastfeed'){ const tot=(d.leftSec||0)+(d.rightSec||0); d.durationSec = tot>0?tot:durationSec; }
  else if(s.type==='sleep'||s.type==='cry'||s.type==='pump'){ if(durationSec!=null) d.durationSec=durationSec; }
  const payload={ type:s.type, at:s.at, endAt:s.endAt, caregiver:s.caregiver, note:s.note||undefined, data:d };
  if(s.editing) updateEvent(s.editing.id, payload); else addEvent(payload);
  closeSheet(); render();
}

/* ----------------------------------------------------------- import/export -- */
function csvCell(v){ if(v==null) return ''; const sx=String(v); return /[",\n]/.test(sx)?'"'+sx.replace(/"/g,'""')+'"':sx; }
function exportCsv(){
  const header=['date','time','type','caregiver','details','note'];
  const rows=events.slice().sort((a,b)=>a.at-b.at).map(e=>{
    const det=Object.entries(e.data||{}).map(([k,v])=>k+'='+v).join('; ')+(e.endAt?(' (ended '+clock(e.endAt)+')'):'');
    return [dateKey(e.at),clock(e.at),e.type,e.caregiver,det,e.note||''];
  });
  return [header].concat(rows).map(r=>r.map(csvCell).join(',')).join('\n');
}
function download(name, content, mime){
  const b=new Blob([content],{type:mime}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const j=JSON.parse(reader.result);
      if(j.app!=='baby-care-tracker'||!Array.isArray(j.events)) throw new Error(t('Not a valid backup file.'));
      const seen=new Set(events.map(e=>e.type+'|'+e.at+'|'+e.caregiver)); let added=0;
      for(const ev of j.events){ const k=ev.type+'|'+ev.at+'|'+ev.caregiver; if(seen.has(k))continue; seen.add(k);
        const ne=Object.assign({},ev,{id:newId()}); events.push(ne); queueUpsert(ne); added++; }
      persistEvents();
      // a backup may optionally carry a profile (name / date of birth)
      if(j.settings && typeof j.settings==='object'){
        const patch={}; if(j.settings.babyName) patch.babyName=j.settings.babyName; if('babyDob' in j.settings) patch.babyDob=j.settings.babyDob;
        if(Object.keys(patch).length) saveSettings(patch); else render();
      } else render();
      const el=document.getElementById('ioMsg'); if(el) el.textContent=t('imported',{n:added,label:(added===1?t('new entry'):t('new entries'))});
    }catch(err){ const el=document.getElementById('ioMsg'); if(el) el.textContent=err.message||t('Import failed.'); }
  };
  reader.readAsText(file);
}

/* --------------------------------------------------------------- listeners -- */
document.addEventListener('click', (ev)=>{
  const el=ev.target.closest('[data-tab],[data-log],[data-edit],[data-filter],[data-act],[data-unit],[data-lang],[data-themeset],[data-rm-care],[data-chip] [data-v],[data-preset],[data-preset-str],[data-tadj]');
  if(!el) return;
  if(el.dataset.tadj!=null && state.sheet){
    state.sheet.at = Date.now() - (+el.dataset.tadj)*60000;
    const inp=sheetRoot.querySelector('[data-when=at]');   // update in place — no re-render, keeps scroll position
    if(inp) inp.value=toLocalInput(state.sheet.at);
    return;
  }

  if(el.dataset.tab){ state.tab=el.dataset.tab; render(); if(el.dataset.tab==='home' && !weatherCache) fetchWeather(); return; }
  if(el.dataset.log){ openSheet(el.dataset.log,null,null); return; }
  if(el.dataset.edit){ const e=findEvent(el.dataset.edit); if(e) openSheet(null,e,null); return; }
  if(el.dataset.filter){ state.filter=el.dataset.filter; render(); return; }
  if(el.dataset.unit){ saveSettings({tempUnit:el.dataset.unit}); return; }
  if(el.dataset.lang){ saveSettings({lang:el.dataset.lang}); return; }
  if(el.dataset.themeset){ saveSettings({theme:el.dataset.themeset}); return; }
  if(el.dataset.rmCare){ if(settings.caregivers.length>1){ const cs=settings.caregivers.filter(c=>c!==el.dataset.rmCare); saveSettings({caregivers:cs, currentCaregiver: cs.includes(settings.currentCaregiver)?settings.currentCaregiver:cs[0]}); } return; }

  // chip selection inside sheet / caregiver
  const chipWrap=el.closest('[data-chip]');
  if(chipWrap && el.dataset.v!=null){
    const field=chipWrap.dataset.chip; const val=el.dataset.v;
    if(state.sheet){
      if(field==='caregiver'){ state.sheet.caregiver=val; }
      else { state.sheet.draft[field]=val; }
      renderSheet();
    }
    return;
  }
  if(el.dataset.preset && state.sheet){ state.sheet.draft[el.dataset.preset]=+el.dataset.pv; renderSheet(); return; }
  if(el.dataset.presetStr && state.sheet){ state.sheet.draft[el.dataset.presetStr]=el.dataset.pv; renderSheet(); return; }

  const act=el.dataset.act;
  if(!act) return;
  if(act==='close') return closeSheet();
  if(act==='info-toggle'){ if(state.sheet){ state.sheet.showInfo=!state.sheet.showInfo; renderSheet(); } return; }
  if(act==='save') return saveSheet();
  if(act==='delete'){ if(state.sheet&&state.sheet.editing&&confirm(t('Delete this entry?'))){ deleteEvent(state.sheet.editing.id); closeSheet(); render(); } return; }
  if(act==='bf-start') return startBreastfeed(el.dataset.side);
  if(act==='bf-switch') return switchBreast();
  if(act==='bf-pause') return pauseBreast();
  if(act==='bf-stop') return stopBreast();
  if(act==='sleep-start') return startSleep();
  if(act==='sleep-stop') return stopSleep();
  if(act==='add-care'){ const inp=document.getElementById('newCare'); const n=(inp.value||'').trim(); if(n&&!settings.caregivers.includes(n)) saveSettings({caregivers:settings.caregivers.concat(n)}); return; }
  if(act==='export-csv') return download('baby-care-'+dateKey(Date.now())+'.csv', exportCsv(), 'text/csv');
  if(act==='export-json') return download('baby-care-backup-'+dateKey(Date.now())+'.json', JSON.stringify({app:'baby-care-tracker',version:1,exportedAt:Date.now(),events:events},null,2), 'application/json');
  if(act==='import'){ const fi=document.createElement('input'); fi.type='file'; fi.accept='application/json,.json'; fi.onchange=()=>{ if(fi.files[0]) importBackup(fi.files[0]); }; fi.click(); return; }
  if(act==='sync-now') return syncNow();
  if(act==='toggle-feedgap') return saveSettings({ feedGapEnabled: !settings.feedGapEnabled });
  if(act==='toggle-vitd') return saveSettings({ vitDEnabled: !settings.vitDEnabled });
  if(act==='log-vitd'){ addEvent({type:'medication', at:Date.now(), caregiver:settings.currentCaregiver, data:{name:t('Vitamin D'), dose:'400 IU'}}); render(); return; }
});

// text / number / datetime inputs (no full re-render to preserve focus)
document.addEventListener('input', (ev)=>{
  const el=ev.target;
  // settings live edit
  if(el.dataset && el.dataset.set){
    const key=el.dataset.set;
    if(key==='babyDob'){ settings.babyDob = el.value?fromLocalInput(el.value):null; }
    else if(key==='lat'||key==='lon'){ settings[key]=parseFloat(el.value); }
    else { settings[key]=el.value; }
    saveJSON(LS.settings, settings);
    return;
  }
  if(el.dataset && el.dataset.setnum){ settings[el.dataset.setnum]=parseFloat(el.value)||0; saveJSON(LS.settings, settings); return; }
  if(!state.sheet) return;
  const s=state.sheet;
  if(el.dataset.num!=null){ const mul=el.dataset.mul?+el.dataset.mul:1; s.draft[el.dataset.num]= el.value===''?(el.dataset.num==='leftSec'||el.dataset.num==='rightSec'?0:undefined):(parseFloat(el.value)*mul);
    if(el.dataset.live==='temp'){ const a=assessTemperature(s.draft.celsius,s.draft.method); const mEl=document.getElementById('tempMsg'); if(mEl){ mEl.className='banner '+a.level; mEl.innerHTML=t(a.msg); } }
    if(el.dataset.num==='leftSec'||el.dataset.num==='rightSec'){ const tot=(s.draft.leftSec||0)+(s.draft.rightSec||0); const bt=document.getElementById('bfTotal'); if(bt) bt.textContent=tot>0?(t('Total')+' '+fmtDur(tot)+' · L '+fmtDur(s.draft.leftSec)+' / R '+fmtDur(s.draft.rightSec)):''; }
    return; }
  if(el.dataset.str!=null){ s.draft[el.dataset.str]=el.value; return; }
  if(el.dataset.when!=null){ s[el.dataset.when]= el.value?fromLocalInput(el.value):undefined; return; }
  if(el.dataset.note!=null){ s.note=el.value; return; }
});

// live tick for running timers on Home
setInterval(()=>{ if(state.tab==='home' && !state.sheet && (getTimer('breastfeed')||getTimer('sleep'))) render(); }, 1000);

/* ------------------------------------------------------------------- boot --- */
applyTheme();
render();
fetchWeather();
if(syncReady()) syncNow();
// keep two phones fresh: pull when the tab regains focus
window.addEventListener('focus', ()=>{ if(syncReady() && !syncState.syncing) syncNow(); });
</script>
